<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>일정 달력 메인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#444}a:hover{color:#111}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; min-height: 980px; position: relative; box-sizing: border-box; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 12px; font-family: 'Gowun Dodum', sans-serif; background: {{bgHex}}; transition: background 0.25s">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 0">
    <h1 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 30px; font-weight: 400; color: {{ink}}">일정 달력</h1>
    <div style="display: flex; align-items: center; gap: 6px; background: #FFFFFF; border-radius: 999px; padding: 8px 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#FFC107" stroke="#B7791F" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <span style="font-family: 'Jua', sans-serif; font-size: 18px; color: #222">{{pointsText}}점</span>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; color: #555">배경 색 고르기 · {{bgName}}</span>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 34px; flex: none; font-size: 12px; color: #555">진한</span>
      <div style="flex: 1; display: flex; justify-content: space-between">
        <sc-for list="{{swatchesDark}}" as="sw" hint-placeholder-count="9">
          <button aria-label="{{sw.name}}" onClick="{{sw.pick}}" style="{{sw.style}}"></button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 34px; flex: none; font-size: 12px; color: #555">연한</span>
      <div style="flex: 1; display: flex; justify-content: space-between">
        <sc-for list="{{swatchesLight}}" as="sw" hint-placeholder-count="9">
          <button aria-label="{{sw.name}}" onClick="{{sw.pick}}" style="{{sw.style}}"></button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 18px; padding: 14px 12px 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 6px 10px">
      <button aria-label="이전 달" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: #F2F2F2; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 22px; font-weight: 400; color: #222">2026년 11월</h2>
      <button aria-label="다음 달" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: #F2F2F2; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; font-size: 13px; padding-bottom: 6px">
      <span style="color: #C62828">일</span><span style="color: #555">월</span><span style="color: #555">화</span><span style="color: #555">수</span><span style="color: #555">목</span><span style="color: #555">금</span><span style="color: #1565C0">토</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
        <sc-if value="{{c.real}}" hint-placeholder-val="{{ true }}">
          <button aria-label="{{c.label}}" onClick="{{c.pick}}" style="{{c.style}}">
            <span>{{c.day}}</span>
            <span style="{{c.dotStyle}}"></span>
          </button>
        </sc-if>
        <sc-if value="{{c.blank}}" hint-placeholder-val="{{ false }}">
          <span style="height: 46px"></span>
        </sc-if>
      </sc-for>
    </div>
    <div style="display: flex; gap: 14px; justify-content: center; padding-top: 10px; font-size: 12px; color: #555">
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #555"></span>일정 있음</span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 14px; height: 14px; border-radius: 4px; border: 2px solid #222; box-sizing: border-box"></span>오늘</span>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 18px; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 20px; font-weight: 400; color: #222">{{selTitle}}</h2>
      <span style="font-size: 13px; color: #555">{{doneCount}} / {{totalCount}} 완료</span>
    </div>

    <sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #F6F6F6">
            <button aria-label="{{it.checkLabel}}" onClick="{{it.toggle}}" style="{{it.boxStyle}}">
              <sc-if value="{{it.done}}" hint-placeholder-val="{{ false }}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
              </sc-if>
            </button>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="{{it.titleStyle}}">{{it.title}}</span>
              <span style="font-size: 13px; color: #555">{{it.time}}</span>
            </div>
            <span style="{{it.tagStyle}}">{{it.tag}}</span>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{noItems}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; padding: 18px 0; text-align: center; font-size: 15px; color: #555">이 날은 일정이 없어요</p>
    </sc-if>

    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #FFF6D6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.8 2.5-5.5.5 1.5 1.5 2.3 2.5 2.5-.5-2.5 0-5 0-7z"/></svg>
      <span style="font-size: 14px; color: #5B3A00">{{streakText}}</span>
    </div>

    <button onClick="{{openSheet}}" style="height: 52px; border: 0; border-radius: 14px; background: {{btnBg}}; color: {{btnInk}}; font-family: 'Jua', sans-serif; font-size: 19px; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      일정 추가
    </button>
  </div>

  <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.45); display: flex; flex-direction: column; justify-content: flex-end">
      <div style="background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <h2 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 22px; font-weight: 400; color: #222">새 일정 추가</h2>
          <button aria-label="닫기" onClick="{{closeSheet}}" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #F2F2F2; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="f-title" style="font-size: 14px; color: #333">① 제목</label>
          <input id="f-title" type="text" placeholder="예: 피아노 학원" value="{{fTitle}}" onChange="{{onTitle}}" style="height: 46px; box-sizing: border-box; border: 2px solid #D0D0D0; border-radius: 12px; padding: 0 12px; font-size: 16px; font-family: inherit">
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 14px; color: #333">② 시간</span>
          <div style="display: flex; align-items: center; gap: 8px">
            <label for="f-start" style="font-size: 13px; color: #555">시작</label>
            <input id="f-start" type="time" value="{{fStart}}" onChange="{{onStart}}" style="flex: 1; min-width: 0; height: 46px; box-sizing: border-box; border: 2px solid #D0D0D0; border-radius: 12px; padding: 0 8px; font-size: 16px; font-family: inherit">
            <span style="color: #555">~</span>
            <label for="f-end" style="font-size: 13px; color: #555">끝</label>
            <input id="f-end" type="time" value="{{fEnd}}" onChange="{{onEnd}}" style="flex: 1; min-width: 0; height: 46px; box-sizing: border-box; border: 2px solid #D0D0D0; border-radius: 12px; padding: 0 8px; font-size: 16px; font-family: inherit">
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 14px; color: #333">③ 어떤 일정이에요?</span>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <button onClick="{{pickOnce}}" style="{{onceStyle}}">한 번 ({{selShort}})</button>
            <button onClick="{{pickReg}}" style="{{regStyle}}">정규 (반복)</button>
          </div>
        </div>

        <sc-if value="{{fReg}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 6px; background: #F6F6F6; border-radius: 14px; padding: 10px">
            <span style="font-size: 13px; color: #333">반복할 날짜를 눌러서 골라요 · {{fDateCount}}일 선택</span>
            <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; text-align: center; font-size: 12px; color: #555">
              <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px">
              <sc-for list="{{miniCells}}" as="m" hint-placeholder-count="30">
                <button aria-label="{{m.label}}" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.day}}</button>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{hasErr}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; font-size: 14px; color: #B71C1C">{{err}}</p>
        </sc-if>

        <button onClick="{{save}}" style="height: 52px; border: 0; border-radius: 14px; background: {{btnBg}}; color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 19px">저장하기</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { bg: 'red', sel: 27, done: { '27-piano': true }, added: [], open: false, fTitle: '', fStart: '15:00', fEnd: '16:00', fReg: false, fDates: [], err: '' };
  }
  renderVals() {
    const COLORS = [
      { id: 'red', name: '빨강', hex: '#E53935', ink: '#FFFFFF', btn: '#C62828' },
      { id: 'orange', name: '주황', hex: '#FB8C00', ink: '#2B1600', btn: '#E65100' },
      { id: 'yellow', name: '노랑', hex: '#FDD835', ink: '#3A2E00', btn: '#8D6E00' },
      { id: 'green', name: '초록', hex: '#43A047', ink: '#FFFFFF', btn: '#2E7D32' },
      { id: 'blue', name: '파랑', hex: '#1E88E5', ink: '#FFFFFF', btn: '#1565C0' },
      { id: 'navy', name: '남색', hex: '#283593', ink: '#FFFFFF', btn: '#283593' },
      { id: 'purple', name: '보라', hex: '#8E24AA', ink: '#FFFFFF', btn: '#7B1FA2' },
      { id: 'pink', name: '핑크', hex: '#EC407A', ink: '#FFFFFF', btn: '#C2185B' },
      { id: 'brown', name: '갈색', hex: '#795548', ink: '#FFFFFF', btn: '#5D4037' }
    ];
    const LIGHT = ['#FFCDD2', '#FFE0B2', '#FFF9C4', '#C8E6C9', '#BBDEFB', '#C5CAE9', '#E1BEE7', '#F8BBD0', '#D7CCC8'];
    const LIGHTS = COLORS.map((c, i) => ({ id: c.id + '-light', name: '연한 ' + c.name, hex: LIGHT[i], ink: '#222222', btn: c.btn }));
    const ALL = COLORS.concat(LIGHTS);
    const cur = ALL.find((c) => c.id === this.state.bg) || COLORS[0];
    const toSw = (c) => ({
      name: c.name + ' 배경',
      pick: () => this.setState({ bg: c.id }),
      style: 'width: 28px; height: 28px; border-radius: 50%; padding: 0; background: ' + c.hex + '; border: ' + (c.id === cur.id ? '3px solid #222; box-shadow: 0 0 0 2px #FFFFFF inset' : '2px solid rgba(0,0,0,0.12)')
    });
    const swatchesDark = COLORS.map(toSw);
    const swatchesLight = LIGHTS.map(toSw);

    const REG = [2, 4, 6, 9, 11, 13, 16, 18, 20, 23, 25, 27, 30];
    const ONCE = { 27: [{ id: 'party', title: '친구 생일파티', time: '18:00 ~ 19:30' }], 14: [{ id: 'trip', title: '가족 나들이', time: '10:00 ~ 15:00' }] };
    const itemsFor = (d) => {
      const list = [];
      if (REG.indexOf(d) >= 0) {
        list.push({ id: 'piano', title: '피아노 학원', time: '15:00 ~ 16:00', reg: true });
        list.push({ id: 'math', title: '수학 학원', time: '16:30 ~ 17:30', reg: true });
      }
      (ONCE[d] || []).forEach((o) => list.push(Object.assign({ reg: false }, o)));
      this.state.added.forEach((a) => { if (a.dates.indexOf(d) >= 0) list.push(a); });
      list.sort((x, y) => (x.time < y.time ? -1 : 1));
      return list;
    };

    const TODAY = 27;
    const cells = [];
    for (let d = 1; d <= 30; d++) {
      const sel = d === this.state.sel;
      const has = itemsFor(d).length > 0;
      const dow = (d - 1) % 7;
      const color = sel ? '#FFFFFF' : dow === 0 ? '#C62828' : dow === 6 ? '#1565C0' : '#222';
      cells.push({
        real: true, blank: false, day: d,
        label: '11월 ' + d + '일' + (has ? ', 일정 있음' : ''),
        pick: () => this.setState({ sel: d }),
        style: 'height: 46px; border-radius: 12px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 16px; font-family: inherit; color: ' + color + '; background: ' + (sel ? cur.btn : 'transparent') + '; border: ' + (d === TODAY && !sel ? '2px solid #222' : '2px solid transparent'),
        dotStyle: 'width: 6px; height: 6px; border-radius: 50%; background: ' + (has ? (sel ? color : '#555') : 'transparent')
      });
    }
    for (let i = 0; i < 5; i++) cells.push({ real: false, blank: true });

    const sd = this.state.sel;
    const raw = itemsFor(sd);
    const items = raw.map((it) => {
      const key = sd + '-' + it.id;
      const done = !!this.state.done[key];
      return {
        title: it.title, time: it.time, done: done,
        tag: it.reg ? '정규' : '한 번',
        checkLabel: it.title + (done ? ' 완료 취소' : ' 완료하기'),
        toggle: () => { const nd = Object.assign({}, this.state.done); nd[key] = !done; this.setState({ done: nd }); },
        boxStyle: 'width: 32px; height: 32px; flex: none; border-radius: 9px; padding: 0; display: flex; align-items: center; justify-content: center; background: ' + (done ? cur.btn : '#FFFFFF') + '; border: 2px solid ' + (done ? cur.btn : '#9E9E9E'),
        titleStyle: 'font-size: 16px; color: ' + (done ? '#757575' : '#222') + '; text-decoration: ' + (done ? 'line-through' : 'none'),
        tagStyle: 'flex: none; font-size: 12px; padding: 4px 9px; border-radius: 999px; ' + (it.reg ? 'background: #E3F2FD; color: #0D47A1' : 'background: #FCE4EC; color: #880E4F')
      };
    });

    const doneAll = Object.keys(this.state.done).filter((k) => this.state.done[k]).length;
    const todayItems = itemsFor(TODAY);
    const todayDone = todayItems.filter((it) => this.state.done[TODAY + '-' + it.id]).length;
    const streak3 = todayDone === todayItems.length;
    const pts = 36 + doneAll * 1.5 + (streak3 ? 6 : 0);
    const doneHere = items.filter((i) => i.done).length;
    const wd = ['일', '월', '화', '수', '목', '금', '토'][(sd - 1) % 7];

    const st = this.state;
    const pillStyle = (on) => 'height: 46px; border-radius: 12px; font-size: 15px; border: 2px solid ' + (on ? cur.btn : '#D0D0D0') + '; background: ' + (on ? cur.btn : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#333');
    const miniCells = [];
    for (let d = 1; d <= 30; d++) {
      const on = st.fDates.indexOf(d) >= 0;
      miniCells.push({
        day: d, on: on ? 'true' : 'false',
        label: '11월 ' + d + '일' + (on ? ' 선택됨' : ''),
        pick: () => { const nd = on ? st.fDates.filter((x) => x !== d) : st.fDates.concat([d]); this.setState({ fDates: nd, err: '' }); },
        style: 'height: 34px; border-radius: 9px; padding: 0; font-size: 14px; border: 0; background: ' + (on ? cur.btn : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#222')
      });
    }
    const save = () => {
      const title = st.fTitle.trim();
      if (!title) { this.setState({ err: '제목을 써 주세요.' }); return; }
      if (!st.fStart || !st.fEnd || st.fEnd <= st.fStart) { this.setState({ err: '끝 시간은 시작 시간보다 늦어야 해요.' }); return; }
      if (st.fReg && st.fDates.length === 0) { this.setState({ err: '반복할 날짜를 하나 이상 골라 주세요.' }); return; }
      const item = { id: 'a' + Date.now(), title: title, time: st.fStart + ' ~ ' + st.fEnd, reg: st.fReg, dates: st.fReg ? st.fDates.slice() : [st.sel] };
      this.setState({ added: st.added.concat([item]), open: false });
    };

    return {
      open: st.open, fTitle: st.fTitle, fStart: st.fStart, fEnd: st.fEnd, fReg: st.fReg,
      fDateCount: st.fDates.length, miniCells: miniCells, err: st.err, hasErr: !!st.err,
      selShort: '11/' + sd,
      onceStyle: pillStyle(!st.fReg), regStyle: pillStyle(st.fReg),
      openSheet: () => this.setState({ open: true, fTitle: '', fStart: '15:00', fEnd: '16:00', fReg: false, fDates: [sd], err: '' }),
      closeSheet: () => this.setState({ open: false }),
      onTitle: (e) => this.setState({ fTitle: e.target.value, err: '' }),
      onStart: (e) => this.setState({ fStart: e.target.value, err: '' }),
      onEnd: (e) => this.setState({ fEnd: e.target.value, err: '' }),
      pickOnce: () => this.setState({ fReg: false, err: '' }),
      pickReg: () => this.setState({ fReg: true, err: '' }),
      save: save,
      bgHex: cur.hex, ink: cur.ink, bgName: cur.name, btnBg: cur.btn, btnInk: '#FFFFFF',
      swatchesDark: swatchesDark, swatchesLight: swatchesLight, cells: cells, items: items,
      hasItems: items.length > 0, noItems: items.length === 0,
      selTitle: '11월 ' + sd + '일 (' + wd + ')',
      doneCount: doneHere, totalCount: items.length,
      pointsText: pts % 1 ? pts.toFixed(1) : String(pts),
      streakText: streak3 ? '3일 연속 다 끝냈어요! 보너스 +6점' : '2일 연속 성공 중! 오늘 다 끝내면 +6점'
    };
  }
}
</script>
</body>
</html>
